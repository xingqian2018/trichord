# cosmos_ultra_ladder.yml = cosmos_ultra.yml without four tasks, for routine evals of ladder checkpoints
# (tests/test_cosmos_eval.py checks this file stays cosmos_ultra.yml minus exactly these):
#   mmlu_pro_0_shot_sampled  5-6 h per eval on one node; mmlu_pro_5_shot_base stays as the MMLU-Pro number
#   hle_text_sampled         about 2.4 h per eval; pretrained-only checkpoints score near the floor
#   bigcodebench_complete_greedy, bigcodebench_instruct_greedy
#                            the harness never runs the task's TestCases (a program that exits 0 passes, an empty
#                            answer too), so the score is not valid until the official checker is in this repository
# With all of them a 30-layer checkpoint needs 7+ h on one node, without them about 3 h.
#
# Cosmos task list (English + Chinese): nemo6_report.yml without wmt24pp and with the Chinese subtasks of the three
# multilingual groups. Settings that differ from the task yamls are explicit here so they are recorded in the results:
#   cache_requests: true         response cache = a preempted job resumes where it stopped. Safe for sampled tasks:
#                                the harness gives repeat r the request seed r, which is part of the cache key.
#   generation_kwargs.max_gen_toks
#     math_500_sampled, minerva_math_nemo 4096   ADLR's 1024 cut 5-14 % of our checkpoints' samples and 12 % of
#                                Qwen3-235B's before they finished. Decision 2026-11-11 (a cap of ~31K tokens,
#                                decided the day before, was dropped before any model completed it).
#     aime24, aime25, hmmt_sampled 4096   same family: at 1024 / 2048 they were cut 2-5 times as often as MATH-500
#                                was at 1024. Decision 2026-11-12.
#   lcb_codegen                  greedy (temperature 0) with max_gen_toks 1024. ADLR's entry kept the task yaml's
#                                temperature 0.6 with one repeat and 256 tokens: one random sample per problem, cut
#                                for 13-19 % of the problems, i.e. a noisier copy of repeat 0 of lcb_codegen_sampled.
#                                Decision 2026-11-12.
#     mgsm_native_cot_zh 4096; trivia_qa / naturalqs_5shot 256   these task yamls set no cap, so the
#                                client default (256 or 1024, depending on the endpoint preset) would apply.
#   metadata.token_window 16383  likelihood tasks: the local-completions client otherwise cuts contexts to 2048 tokens.
#                                It sends window + 1 tokens, and the server takes 16384 (cosmos_eval/lanes.py checks).
#   aime24 / aime25 dataset      the task yamls fetch from GitLab at run time; offline nodes use the local copy.
#   alias of gpqa_diamond_cot_n_shot_sampled / mmlu_pro_0_shot_sampled = the result key (the old alias was reported
#                                as missing by nvbench/assemble_report_results.py).
#   num_fewshot 5 for gpqa_diamond_cot_n_shot_sampled, 4 for hmmt_sampled   the few-shot prompts of the greedy
#                                variants (since 2026-11-12 also the task yamls' own definition; they were zero-shot
#                                instructions, which a pretrained-only model repeats instead of following).
#   OFFICIAL PROTOCOLS (2026-11-12, cosmos_eval/README.md "Aligned with the official protocols"): prompt, shots,
#   stops and answer reading of each task are those of the benchmark's own code where it has one. What is NOT the
#   official value, on purpose:
#     gpqa_* 2048 new tokens     official 1000 (zero-shot CoT) / 600; a longer cap only lets more answers finish.
#     supergpqa_main_cot_n_shot 2048   official 4096. Twice the cap doubles the time of the looping responses of the
#                                task that bounds the wall time, for at most 0.1-0.2 point.
#     humaneval_sampled          temperature 0.2 (Codex paper: the best value for pass@1; upstream lm-eval), set here;
#                                the task yaml keeps the fork's 0.6, which ADLR's lists use. top_p 0.95 is official.
#     mbpp_sanitized_3shot_sampled   temperature 0.5 without nucleus sampling (the MBPP paper), set here; 32 samples
#                                instead of 80.
#     lcb_codegen_sampled        temperature 0.2 = the official value, set here (the task yaml keeps the fork's 0.6,
#                                which ADLR's lists use); 32 samples instead of 10; cap 1024 instead of 2000 (worth
#                                -0.04 to +0.01 point on stored samples).
#     mmlu_pro_5_shot_base       exact_match_official = an unanswered question counts 1 / number of options (the
#                                expectation of the official random guess); exact_match counts it wrong.
#     agieval_en_cot             macro average over the 8 sets = the official "average for English multi choice QA";
#                                custom-extract is the official answer reading (it reads an unanswered response as
#                                "E"), no-fallback the same without that rule; the last line is the size-weighted mean.
#     popqa_15shot               the official 15-shot protocol (replaces popqa_5shot, whose yaml stays in the repo);
#                                acc_substring is the official accuracy.
#     race_high_all              every question of RACE-high (3,498), 0-shot; replaces `race` (last question of each
#                                passage, with the answers of the passage's earlier questions in the prompt).
#     trivia_qa                  exact_match over all rows (upstream lm-eval's set); exact_match_wiki = the Wikipedia
#                                rows (Meta's TriviaQA-Wiki).
#     gsm8k_cot                  the original 8-shot prompt of Wei et al. next to NeMo-Skills' gsm8k_cot_nemo.
#     minerva_math_nemo          exact_match_hendrycks = the benchmark's own scoring (last box, string comparison).
#   mmlu, mmlu_redux             letter LIKELIHOOD (the standard protocol for pretrained models: original MMLU code,
#                                upstream lm-eval, Meta, DeepSeek, OpenCompass), not the generated letter of
#                                mmlu_str / mmlu_redux_str: same prompt, and the same decision whenever the top token
#                                is a letter, but a model that answers with something else (a distilled checkpoint on
#                                instruction-like questions, several reference models) is no longer scored wrong.
#                                acc_ties_shared: an exact tie at the top counts 1/k. Decision 2026-11-12.
#   multiple-choice sampled tasks (gpqa_diamond_cot_n_shot_sampled, mmlu_pro_0_shot_sampled) report pass@1 (the mean
#                                over the 32 samples) and majority (the most frequent answer of the 32), not
#                                pass@32: that is the chance that one of 32 samples hits the letter (97 % for
#                                uniform guessing among ten options), and a more random model scores higher.
#   minerva_math_nemo reports exact_match only: the group values of level_5_exact_match and math500_exact_match weight
#                                each subject's subset mean by the subject's FULL size (level 5 comes out 0.7-1.3 points
#                                too high); the right values are means over the flagged documents of the samples files.
#   piqa, social_iqa and openbookqa report acc and acc_norm: their answers are free text of different lengths, and
#                                the choice of metric moves a comparison (piqa: q5 vs a 30B reference is +0.5 or -1.9
#                                points; openbookqa: q1 -> q2 is +4.8 in acc and +0.4 in acc_norm).
# What a task measures for a pretrained-only checkpoint is in cosmos_eval/README.md.
version: 1.0
tasks:
  - task_name: mbpp_sanitized_3shot_sampled
    task_group: code
    batch_size: 128
    cache_requests: true
    overrides:
      repeats: 32
      generation_kwargs.temperature: 0.5
      generation_kwargs.top_p: 1.0
    report_metric:
      - alias: mbpp_sanitized_3shot_sampled
        metric: pass@1[32],evalplus_sanitized
      - alias: mbpp_sanitized_3shot_sampled
        metric: pass@32[32],evalplus_sanitized
  - task_name: humaneval_sampled
    task_group: code
    batch_size: 128
    cache_requests: true
    overrides:
      repeats: 32
      generation_kwargs.temperature: 0.2
    report_metric:
      - alias: humaneval_sampled
        metric: pass@1[32],evalplus_sanitized
      - alias: humaneval_sampled
        metric: pass@32[32],evalplus_sanitized
  - task_name: lcb_codegen
    task_group: code
    batch_size: 32
    cache_requests: true
    overrides:
      repeats: 1
      test_split: release_v6
      generation_kwargs.do_sample: false
      generation_kwargs.temperature: 0.0
      generation_kwargs.max_gen_toks: 1024
    report_metric:
      - alias: lcb_codegen
        metric: pass@1[1],score
  - task_name: lcb_codegen_sampled
    task_group: code
    batch_size: 32
    cache_requests: true
    overrides:
      repeats: 32
      test_split: release_v6
      generation_kwargs.temperature: 0.2
    report_metric:
      - alias: lcb_codegen_sampled
        metric: pass@1[32],score
      - alias: lcb_codegen_sampled
        metric: pass@32[32],score
  - task_name: mmlu_pro_5_shot_base
    task_group: aggregate
    batch_size: 32
    use_cache: true
    cache_requests: true
    report_metric:
      - alias: mmlu_pro_5_shot_base
        metric: exact_match_official,tigerlab-extract
      - alias: mmlu_pro_5_shot_base
        metric: exact_match,tigerlab-extract
      - alias: mmlu_pro_5_shot_base
        metric: no_answer,tigerlab-extract
  - task_name: math_500_sampled
    task_group: math
    batch_size: 128
    num_fewshot: 4
    cache_requests: true
    overrides:
      repeats: 32
      generation_kwargs.max_gen_toks: 4096
    report_metric:
      - alias: math_500_sampled
        metric: pass@1[32],math_verify
      - alias: math_500_sampled
        metric: pass@32[32],math_verify
  - task_name: hmmt_sampled
    task_group: math
    batch_size: 16
    num_fewshot: 4
    cache_requests: true
    overrides:
      repeats: 32
      generation_kwargs.max_gen_toks: 4096
    report_metric:
      - alias: hmmt_sampled
        metric: pass@1[32],math_verify
      - alias: hmmt_sampled
        metric: pass@32[32],math_verify
  - task_name: gsm8k_cot_nemo
    task_group: math
    batch_size: 64
    cache_requests: true
    report_metric:
      - alias: gsm8k_cot_nemo
        metric: exact_match,none
  - task_name: gsm8k_cot
    task_group: math
    batch_size: 64
    cache_requests: true
    report_metric:
      - alias: gsm8k_cot
        metric: exact_match,strict-match
      - alias: gsm8k_cot
        metric: exact_match,flexible-extract
  - task_name: minerva_math_nemo
    task_group: math
    batch_size: 64
    num_fewshot: 4
    cache_requests: true
    overrides:
      generation_kwargs.max_gen_toks: 4096
    report_metric:
      - alias: minerva_math_nemo
        metric: exact_match,none # all math
      - alias: minerva_math_nemo
        metric: exact_match_hendrycks,none
  - task_name: commonsense_qa
    task_group: reasoning
    num_fewshot: 7
    batch_size: 128
    cache_requests: true
    overrides:
      metadata.token_window: 16383
    report_metric:
      - alias: commonsense_qa
        metric: acc,none
      - alias: commonsense_qa
        metric: acc_ties_shared,none
  - task_name: arc_challenge_llama
    task_group: reasoning
    batch_size: 32
    num_fewshot: 25
    cache_requests: true
    overrides:
      metadata.token_window: 16383
    report_metric:
      - alias: arc_challenge_llama
        metric: acc_norm,none
      - alias: arc_challenge_llama
