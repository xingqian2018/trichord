    metric: pass@32[32],evalplus_sanitized
- task_name: lcb_codegen
  task_group: code
  batch_size: 32
  overrides:
    repeats: 1
    test_split: release_v6
    generation_kwargs.max_gen_toks: 256
  report_metric:
  - alias: lcb_codegen
    metric: pass@1[1],score
- task_name: lcb_codegen_sampled
