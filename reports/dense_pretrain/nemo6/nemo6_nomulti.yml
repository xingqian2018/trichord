# nemo6_nomulti.yml = nemo6_report.yml (Boxiang's harness nvbench/nemo6_report.yml @17abcb7) WITHOUT the multilingual tasks
# (user 11-04: '把多语言的测试，直接拿掉' - adlr_global_mmlu, adlr_mgsm, adlr_include, wmt24pp_en_xx removed). Every other task
# entry is copied unchanged (same few-shot / batch size / overrides / report metrics).
version: 1.0
tasks:
- task_name: mbpp_sanitized_3shot_sampled
  task_group: code
  batch_size: 128
  overrides:
    repeats: 32
  report_metric:
  - alias: mbpp_sanitized_3shot_sampled
    metric: pass@1[32],evalplus_sanitized
  - alias: mbpp_sanitized_3shot_sampled
    metric: pass@32[32],evalplus_sanitized
- task_name: humaneval_sampled
