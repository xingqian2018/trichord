function renderPie(d, total) {
  const groups = TAX_GROUPS.map(([name, a, b, color]) => {
    const members = D.orders.taxonomy.slice(a, b);
    return { name, color, n: members.length, v: members.reduce((s, t) => s + (d[t] || 0), 0) };
  });
  const ns = "http://www.w3.org/2000/svg", C = 120, R = 112, r = 68;
  const mk = (tag, at) => { const e = document.createElementNS(ns, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };
  const svg = mk("svg", { viewBox: "0 0 240 240", role: "img", "aria-label": "taxonomy 大类占比环形图" });
  const pt = (ang, rad) => [C + rad * Math.sin(ang), C - rad * Math.cos(ang)];
  let ang = 0;
  groups.forEach(g => {
    if (!g.v || !total) return;
    const frac = g.v / total;
    let node;
    if (frac > 0.9999) {
      node = mk("path", { d: `M${C},${C - R} A${R},${R} 0 1 1 ${C - 0.01},${C - R} Z M${C},${C - r} A${r},${r} 0 1 0 ${C - 0.01},${C - r} Z`, "fill-rule": "evenodd", fill: g.color });
    } else {
      const a1 = ang + frac * 2 * Math.PI, big = frac > 0.5 ? 1 : 0;
      const [x0, y0] = pt(ang, R), [x1, y1] = pt(a1, R), [x2, y2] = pt(a1, r), [x3, y3] = pt(ang, r);
      node = mk("path", { d: `M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big} 0 ${x3},${y3} Z`, fill: g.color });
      ang = a1;
    }
    bindTip(node, `<b>${g.name}</b>（${g.n} 类）<br>${fmt(g.v)} 行 · ${pctStr(g.v, total, 2)}`);
    svg.appendChild(node);
  });
  const t1 = mk("text", { x: C, y: C + 2, "text-anchor": "middle", class: "center" }); t1.textContent = cn(total); svg.appendChild(t1);
  const t2 = mk("text", { x: C, y: C + 22, "text-anchor": "middle", class: "center-sub" }); t2.textContent = "进桶行数"; svg.appendChild(t2);
  const box = document.getElementById("pie"); box.innerHTML = ""; box.appendChild(svg);
  document.getElementById("pieLegend").innerHTML = groups.map(g =>
    `<li><i class="sw" style="background:${g.color}"></i><span>${g.name} <span class="n">${g.n} 类</span></span><span class="v">${pctStr(g.v, total, g.v && pct(g.v, total) < 1 ? 2 : 1)} · ${cn(g.v)}</span></li>`
  ).join("");
}

function columnChart(id, labels, values, opts = {}) {
  const box = document.getElementById(id);
  const W = Math.max(280, box.clientWidth), H = opts.height || 220;
  const m = { t: 22, r: 6, b: 34, l: 6 };
  const total = values.reduce((a, b) => a + b, 0);
  const max = Math.max(...values, 1);
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = labels.length;
  const step = iw / n;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", opts.aria || "");
  const mk = (tag, a) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
  [0.5, 1].forEach(f => svg.appendChild(mk("line", { class: "grid", x1: m.l, x2: W - m.r, y1: m.t + ih * (1 - f), y2: m.t + ih * (1 - f) })));
  svg.appendChild(mk("line", { class: "grid", x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }));
  const pts = values.map((v, i) => [m.l + step * i + step / 2, m.t + ih * (1 - v / max)]);
  const line = smoothPath(pts);
  svg.appendChild(mk("path", { class: "c-area", d: `${line}L${pts[n - 1][0].toFixed(1)},${m.t + ih}L${pts[0][0].toFixed(1)},${m.t + ih}Z` }));
  svg.appendChild(mk("path", { class: "c-line", d: line }));
  labels.forEach((lab, i) => {
    const v = values[i], [x, y] = pts[i];
    const g = mk("g", {});
    const hit = mk("rect", { class: "hit", x: m.l + step * i, y: m.t, width: step, height: ih });
    g.appendChild(hit);
    g.appendChild(mk("circle", { class: "c-dot", cx: x, cy: y, r: 3.5 }));
    const share = pct(v, total);
    if (share >= (opts.labelMin ?? 0.5)) {
      const t = mk("text", { x, y: y - 9, "text-anchor": "middle", class: "val" }); t.textContent = share.toFixed(share < 10 ? 1 : 0) + "%"; g.appendChild(t);
    }
    const tl = mk("text", { x, y: H - 12, "text-anchor": "middle" }); tl.textContent = opts.display ? opts.display(lab) : lab; g.appendChild(tl);
    hit.addEventListener("pointermove", ev => showTip(ev, `<b>${opts.title}：${opts.display ? opts.display(lab) : lab}</b>${opts.extra ? "<br>" + opts.extra(lab) : ""}<br>${fmt(v)} 行 · ${pctStr(v, total, 2)}`));
    hit.addEventListener("pointerleave", hideTip);
    svg.appendChild(g);
  });
  box.innerHTML = ""; box.appendChild(svg);
}

const AR_ORDER = ["<=1:2", ...D.orders.aspect_targets, ">=2:1"];
const AR_DISPLAY = { "<=1:2": "≤1:2", ">=2:1": "≥2:1" };
function arRange(lab) {
  const t = D.orders.aspect_targets, vals = t.map(s => { const [a, b] = s.split(":").map(Number); return a / b; });
  const edges = vals.slice(0, -1).map((v, i) => Math.sqrt(v * vals[i + 1]));
  if (lab === "<=1:2") return "w/h ≤ 0.5";
  if (lab === ">=2:1") return "w/h ≥ 2.0";
  const i = t.indexOf(lab);
  const lo = i === 0 ? 0.5 : edges[i - 1], hi = i === t.length - 1 ? 2.0 : edges[i];
  return `w/h ∈ [${lo.toFixed(3)}, ${hi.toFixed(3)})`;
}

}

const SPK = { w: 480, h: 44, px: 22, pt: 6, pb: 4 };
function spkX(i, n) { return SPK.px + (n > 1 ? i * (SPK.w - 2 * SPK.px) / (n - 1) : (SPK.w - 2 * SPK.px) / 2); }
function smoothPath(pts) {
  const n = pts.length, f = v => v.toFixed(1);
  if (n < 3) return pts.map((q, i) => (i ? "L" : "M") + f(q[0]) + "," + f(q[1])).join("");
  const dx = [], s = [];
  for (let i = 0; i < n - 1; i++) { dx.push(pts[i + 1][0] - pts[i][0]); s.push((pts[i + 1][1] - pts[i][1]) / dx[i]); }
  const t = [s[0]];
  for (let i = 1; i < n - 1; i++) t.push(s[i - 1] * s[i] <= 0 ? 0 : 3 * (dx[i - 1] + dx[i]) / ((2 * dx[i] + dx[i - 1]) / s[i - 1] + (dx[i] + 2 * dx[i - 1]) / s[i]));
  t.push(s[n - 2]);
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 0; i < n - 1; i++) {
    const h3 = dx[i] / 3;
    d += `C${f(pts[i][0] + h3)},${f(pts[i][1] + t[i] * h3)} ${f(pts[i + 1][0] - h3)},${f(pts[i + 1][1] - t[i + 1] * h3)} ${f(pts[i + 1][0])},${f(pts[i + 1][1])}`;
  }
  return d;
}
function sparkline(vals, total, tipOf, color, ofLabel = "占该类") {
  const n = vals.length, max = Math.max(...vals, 1), ih = SPK.h - SPK.pt - SPK.pb;
  const pts = vals.map((v, i) => [spkX(i, n), SPK.pt + ih * (1 - v / max)]);
  const line = smoothPath(pts);
  const area = `${line}L${pts[n - 1][0].toFixed(1)},${SPK.h - SPK.pb}L${pts[0][0].toFixed(1)},${SPK.h - SPK.pb}Z`;
  const peak = vals.indexOf(Math.max(...vals));
  const step = n > 1 ? (SPK.w - 2 * SPK.px) / (n - 1) : SPK.w;
  const hits = vals.map((v, i) => `<rect class="hit" x="${(pts[i][0] - step / 2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${SPK.h}" data-tip="${tipOf(i).replace(/"/g, "&quot;")}<br>${fmt(v)} 行 · ${ofLabel} ${pctStr(v, total, 2)}"></rect>`).join("");
  return `<svg class="spark" style="--c:${color}" viewBox="0 0 ${SPK.w} ${SPK.h}" width="${SPK.w}" height="${SPK.h}" role="img">`
    + `<line class="base" x1="${SPK.px}" x2="${SPK.w - SPK.px}" y1="${SPK.h - SPK.pb}" y2="${SPK.h - SPK.pb}"></line>`
    + `<path class="area" d="${area}"></path><path class="line" d="${line}"></path>`
    + `<circle class="peak" cx="${pts[peak][0].toFixed(1)}" cy="${pts[peak][1].toFixed(1)}" r="3"></circle>${hits}</svg>`;
}
function sparkAxis(labels) {
  const n = labels.length;
  return `<svg class="spark-axis" viewBox="0 0 ${SPK.w} 16" width="${SPK.w}" height="16">`
    + labels.map((l, i) => `<text x="${spkX(i, n).toFixed(1)}" y="12" text-anchor="middle">${l}</text>`).join("") + `</svg>`;
}
function renderCatHeat() {
  document.querySelectorAll("#catTabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.dim === catTab)));
  const c = DIMS[catTab], src = D.cat[c.key];
  const names = current === ALL ? Object.keys(src) : [current];
  const m = {};
  names.forEach(n => { const byTax = src[n] || {}; for (const t in byTax) { m[t] = m[t] || {}; for (const k in byTax[t]) m[t][k] = (m[t][k] || 0) + byTax[t][k]; } });
  const rowTot = t => Object.values(m[t] || {}).reduce((a, b) => a + b, 0);
  const tiers = c.labels.filter(k => Object.values(m).some(r => r[k]));
  const all = Object.values(m).reduce((a, r) => a + Object.values(r).reduce((x, y) => x + y, 0), 0);
  document.getElementById("catNote").textContent = `每条曲线是该 category 进桶图片在各${c.title}档上的分布（${c.note}），按各自最高点归一化，圆点是峰值所在档。鼠标移到曲线上看每档的行数和占比。`;
  let html = `<thead><tr><th>Category</th><th>行数</th><th class="spark-cell">${sparkAxis(tiers.map(c.display))}</th><th>峰值</th></tr></thead><tbody>`;
  TAX_GROUPS.forEach(([gname, a, b, gcolor]) => {
    const rows = D.orders.taxonomy.slice(a, b).map(t => [t, rowTot(t)]).filter(r => r[1]).sort((x, y) => y[1] - x[1]);
    if (!rows.length) return;
    const gsum = rows.reduce((s, r) => s + r[1], 0);
    html += `<tr class="grp"><td colspan="4"><i class="sw" style="background:${gcolor};margin-right:6px;vertical-align:-1px"></i>${gname} · ${cn(gsum)} · ${pctStr(gsum, all)}</td></tr>`;
    rows.forEach(([t, n]) => {
      const vals = tiers.map(k => (m[t] || {})[k] || 0), pk = vals.indexOf(Math.max(...vals));
      html += `<tr><td class="cat-name" title="${t}">${t}</td><td class="mono">${cn(n)} <span style="color:var(--muted)">${pctStr(n, all, n / all < 0.01 ? 2 : 1)}</span></td>`;
      html += `<td class="spark-cell">${sparkline(vals, n, i => `<b>${t}</b> · ${c.title} ${c.display(tiers[i])}`, gcolor)}</td>`;
      html += `<td class="mono">${c.display(tiers[pk])} · ${pctStr(vals[pk], n)}</td></tr>`;
    });
  });
  const tb = document.getElementById("catHeat");
  tb.innerHTML = html + "</tbody>";
  tb.querySelectorAll("rect.hit").forEach(r => bindTip(r, r.dataset.tip));
}
document.getElementById("catTabs").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-dim]"); if (!b || b.dataset.dim === catTab) return;
  catTab = b.dataset.dim;
  try { localStorage.setItem("bucket-cat-dim", catTab); } catch (e) {}
  renderCatHeat();
});

function renderDetail() {
  const t = document.getElementById("detail");
  let html = `<thead><tr><th>数据集</th><th>总行数</th><th>缺 taxonomy</th><th>缺 filter</th><th>缺美学分</th><th>进桶</th><th>进桶比例</th></tr></thead><tbody>`;
  S.forEach(s => { html += `<tr><td class="mono">${s.name}</td><td>${fmt(s.total)}</td><td>${fmt(s.missTax)}</td><td>${fmt(s.missFilter)}</td><td>${fmt(s.missAes)}</td><td>${fmt(s.bucketed)}</td><td>${pctStr(s.bucketed, s.total)}</td></tr>`; });
  html += `</tbody><tfoot><tr><td>合计</td><td>${fmt(tot.total)}</td><td>${fmt(tot.missTax)}</td><td>${fmt(tot.missFilter)}</td><td>${fmt(tot.missAes)}</td><td>${fmt(tot.bucketed)}</td><td>${pctStr(tot.bucketed, tot.total)}</td></tr></tfoot>`;
  t.innerHTML = html;
}

document.getElementById("rules").innerHTML = [
  ["桶的 key", "source_dataset | taxonomy | 分辨率 | 宽高比 | filter | 美学分，只记录至少有 1 行的桶"],
  ["taxonomy", "taxonomy_tag_v0_subcategory 是按可能性排序的 JSON 列表，取第一项，必须是 41 个标准类别之一"],
  ["分辨率", "按像素面积 w×h 分档，每档下限是该档训练画布在各目标宽高比下的最小面积"],
  ["宽高比", "r = w/h，按相邻目标比例的几何平均划分区间，落进离它最近的目标比例；比 1:2 更窄、比 2:1 更宽各单独一档"],
  ["filter", "qwen3vl 的 collage、text_banner、nsfw、watermark、white_background 全为 false 记为通过"],
  ["美学分", "qwen3vl 打分，整数 0–9"],
  ["不进桶的行", "缺 taxonomy、宽高、任一 filter 标记或美学分的行。datacomp_12b 中 datacomp12b_face_duplicated 为 true 的行视为不存在，不计入总行数"],
].map(([k, v]) => `<li><b>${k}：</b>${v}</li>`).join("");

document.getElementById("foot").textContent = `来源 bucket_stats_${D.tag}.json · ${fmt(D.fragments)} 个 fragment，失败 ${D.failed} 个 · ${fmt(D.numBuckets)} 个非空桶`;

function renderAll() { renderScope(); renderTax(); renderCharts(); renderCatHeat(); }
dsSel.addEventListener("change", () => { current = dsSel.value; try { localStorage.setItem("bucket-ds", current); } catch (e) {} renderAll(); });
renderTabs(); renderAll(); renderHeat(); renderDetail();
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(renderCharts, 80); }).observe(document.querySelector(".wrap"));
</script>
