# Poster taxonomy v1, for single-call text-to-image posters (GPT image models).
# Built around what GPT image models do well: short exact text (headlines, taglines, labels),
# broad illustration styles (screen print, risograph, watercolor, flat vector, papercraft,
# art deco, Swiss, Japanese graphic), period styles from world knowledge, infographic and
# explainer layouts with a few labeled parts, ad-style posters with one quoted tagline,
# comic panels, and illustrated maps. It avoids what they do poorly: paragraphs of small
# text, precise charts and geometry, real brands and real people.
# Taxonomy rule: a leaf names a CLASS of poster, never one instance from an open set. When the
# set of instances is open, phrase the leaf as a domain and let the generator pick the subject,
# e.g. "vintage travel poster for a coastal town of your choice".
