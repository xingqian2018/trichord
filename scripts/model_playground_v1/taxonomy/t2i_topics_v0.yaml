# General text-to-image taxonomy v0: every kind of image people ask a generator for, not only posters.
# Three levels: domain > area > leaf. The leaf is what the prompt writer receives (as the full path).
# Taxonomy rule: a leaf names a CLASS of image, never one instance from an open set. When the set of
# instances is open, the leaf names the domain and the writer picks the subject ("a dog breed of your choice").
# Leaves that fix a medium or style say so; elsewhere the writer chooses the medium.
