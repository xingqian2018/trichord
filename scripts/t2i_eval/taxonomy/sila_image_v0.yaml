# SILA image taxonomy (41 subcategories in 6 groups), exported from imaginaire4
# pipelines/sila/image/taxonomy_classifier/prompts.py (SUBCATEGORY_PROMPT). group > subcategory: description
General Images:
  General Image of People and Portraits: Photos mainly showing people, faces, portraits, selfies, or candid human scenes.
  General Image of Architecture and Interiors: Photos mainly showing buildings, rooms, interiors, architectural structures, or construction details.
  General Image of Nature and Landscapes: Outdoor natural or scenic views such as mountains, beaches, forests, deserts, rivers, or skylines.
  General Image of Animals and Wildlife: Photos mainly showing animals, pets, livestock, or wildlife.
  General Image of Plants and Flora: Photos mainly showing plants, flowers, trees, crops, gardens, or botanical subjects.
  General Image of Food and Drink: Photos mainly showing food, beverages, ingredients, dishes, or cooking-related imagery.
  General Image of Cars and Vehicles: Photos mainly showing vehicles such as cars, trucks, buses, motorcycles, bicycles, or transportation objects.
  General Image of Clothing and Accessories: Photos mainly showing clothing, shoes, bags, jewelry, or fashion accessories.
  General Image of Other Objects: General object-centric images that do not fit the categories above.
Text-rich and Data Visualizations:
  Structuralized Diagrams: Structured diagrams that explain systems, workflows, mechanisms, circuits, or processes.
  Tables: Row-column tabular layouts.
  Plots and Charts: Data plots or charts such as line, bar, pie, scatter, or histogram charts.
  Documents: Printed or typed documents, forms, letters, pages, contracts, or reports.
  Handwritings: Handwritten notes, handwritten equations, calligraphy, or handwritten pages.
  Posters and Design: Posters, flyers, ads, branding, covers, or graphic design compositions.
  Infographics: Informational graphics combining text, icons, illustrations, and charts.
  Maps: Geographic maps, route maps, site maps, or map-like navigation displays.
Math and Geometry:
  Mathematical Notations: Equations, formulas, symbolic math expressions, or theorem-like mathematical content.
  Geometric Shapes: Images mainly showing geometric figures, shape puzzles, or abstract geometric constructions.
Art, Science and Knowledge:
  Life Sciences: Biology-related visuals such as cells, organisms, anatomy, microscopy, or biological diagrams.
  Physical Sciences: Science-related visuals from physics, chemistry, geology, astronomy, materials, or lab/scientific illustrations when no more specific physical-phenomena category below is clearly dominant.
  Technology and Engineering: Technology or engineering visuals such as hardware, electronics, machines, CAD, schematics, technical diagrams, or engineering scenes when no more specific physical-AI category below is clearly dominant.
  Medical and Health Sciences: Medical scans, clinical imagery, disease/treatment illustrations, diagnostics, or healthcare-related visuals.
  Art and Music: Paintings, sculpture, music sheets, musical performance imagery, instruments, or creative artistic content.
Screenshots and UI Elements:
  Screenshot of Mobile Apps: Screenshots primarily showing mobile-app interfaces.
  Screenshot of Desktop Apps: Screenshots primarily showing desktop software interfaces.
  Screenshot of Websites: Screenshots primarily showing website pages or web interfaces.
  Screenshot of Other Digital Interfaces: Screenshots of other digital interfaces that are not clearly mobile apps, desktop apps, or websites.
Physical AI Domains:
  Fixed-Base Robotic Manipulators: Images centered on stationary robotic manipulators such as industrial robot arms, SCARA robots, delta robots, or medical robot arms.
  Mobile Robots and Bases: Images centered on wheeled or rolling robots such as AGVs, AMRs, delivery robots, warehouse rovers, or cleaning robots.
  Legged and Humanoid Robots: Images centered on legged robots such as humanoids, bipeds, quadrupeds, or other multi-legged robots.
  Aerial and Aquatic Robots: Images centered on drones, quadcopters, UAVs, underwater robots, ROVs, or aquatic robots.
  Industrial Robotics and Factory Scenes: Images centered on industrial or factory environments such as assembly lines, warehouses, workcells, machinery, or production floors, especially when robotics or automation context is clear.
  Human-Robot Collaboration: Humans and robots are co-located and jointly engaged in a task, such as handover, shared assembly, side-by-side work, or collaborative manipulation.
  Teleoperation and VR Control: Clear evidence of robot remote-control or VR/teleoperation context, such as operator consoles, robot-control interfaces, FPV robot feeds, VR controllers, or teleop workstations.
  Expressive and Social Robots: Images centered on social or expressive robots, such as robots with faces, eyes, gestures, communicative poses, or social interaction intent.
  Autonomous Vehicle Normal Driving Scenes: Ego-view or onboard road-driving scenes under ordinary conditions; use this for driving perception scenes rather than ordinary exterior car photos.
  Autonomous Vehicle Adverse and Hazardous Conditions: Ego-view or transportation-driving scenes where hazards or adverse conditions are dominant, such as collisions, blocked roads, snow, fog, flooding, debris, or dangerous terrain.
  Rigid Body Mechanics: Images centered on physical interactions dominated by rigid objects, such as collisions, impacts, rigid mechanical motion, projectiles, or articulated rigid-body motion.
  Fluid Dynamics and Thermodynamics: Images centered on fluid or thermal phenomena, such as splashes, waves, smoke, fire, steam, melting, boiling, or heat-driven effects.
  Soft Body and Deformation: Images centered on soft-material deformation, such as cloth folding, rope or cable behavior, foam compression, rubber stretching, dough deformation, or jelly-like motion.
